<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/fragments :: appHead('Custody History')}"></head>
<body>
<div th:replace="~{layout/fragments :: appBackdrop}"></div>

<div class="app-shell">
    <aside th:replace="~{layout/fragments :: sideNav('for-history')}"></aside>
    <main class="app-main">
        <header th:replace="~{layout/fragments :: topBar('Custody History', 'Filter and timeline shell for UC-08')}"></header>
        <section class="app-content">
            <article class="card">
                <h2>History filters</h2>
                <form class="form-grid compact-form">
                    <label><span>Evidence ID</span><input type="text" th:value="${evidenceId}"></label>
                    <label><span>Action Type</span><select><option>ALL</option><option>UPLOAD</option><option>VIEW</option></select></label>
                    <button class="btn btn-primary" type="button">Apply</button>
                </form>
            </article>
        </section>
    </main>
</div>

<script th:src="@{/js/app.js}"></script>
</body>
</html>
