<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/fragments :: appHead('Sign In')}"></head>
<body>
<div th:replace="~{layout/fragments :: appBackdrop}"></div>

<main class="auth-shell">
    <section class="auth-card">
        <header>
            <p class="eyebrow">Digital Evidence and Chain-of-Custody</p>
            <h1>Welcome back</h1>
            <p>Sign in with your assigned role account to continue.</p>
        </header>

        <div th:if="${param.error}" class="alert alert-error">Invalid credentials. Try again.</div>
        <div th:if="${param.logout}" class="alert alert-success">You have been signed out.</div>

        <form th:action="@{/login}" method="post" class="form-grid">
            <label>
                <span>Username</span>
                <input type="text" name="username" placeholder="inv-001" required>
            </label>
            <label>
                <span>Password</span>
                <input type="password" name="password" placeholder="password" required>
            </label>
            <button type="submit" class="btn btn-primary">Sign In</button>
        </form>

        <footer class="auth-footnote">
            <p><strong>Dev accounts:</strong> inv-001, foren-001, legal-001, admin-001 (password: <code>password</code>)</p>
            <a th:href="@{/ui-kit}">Open shared UI kit</a>
        </footer>
    </section>
</main>

<script th:src="@{/js/app.js}"></script>
</body>
</html>
