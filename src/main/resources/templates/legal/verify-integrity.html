<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Evidence Integrity</title>
    <style>
        body {
            margin: 0;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f3f8ff 0%, #e8f0ff 100%);
            color: #16213b;
        }
        .container {
            max-width: 760px;
            margin: 40px auto;
            background: #ffffff;
            border-radius: 14px;
            box-shadow: 0 12px 30px rgba(20, 33, 61, 0.12);
            padding: 28px;
        }
        h1 {
            margin-top: 0;
            font-size: 1.7rem;
        }
        .hint {
            color: #51607a;
            margin-bottom: 20px;
        }
        ul {
            list-style: none;
            padding: 0;
            margin: 0;
            display: grid;
            gap: 12px;
        }
        li {
            border: 1px solid #d8e2f2;
            border-radius: 10px;
            padding: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        button {
            background: #1456b8;
            border: 0;
            color: #fff;
            padding: 10px 14px;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Verify Evidence Integrity</h1>
    <p class="hint">Select evidence and run a legal integrity check.</p>

    <ul>
        <li th:each="evidenceId : ${evidenceOptions}">
            <span th:text="${evidenceId}">EVD-0000</span>
            <form th:action="@{'/legal/verify/' + ${evidenceId}}" method="post">
                <button type="submit">Verify</button>
            </form>
        </li>
    </ul>
</div>
</body>
</html>
