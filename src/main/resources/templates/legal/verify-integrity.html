<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/fragments :: appHead('Verify Integrity')}"></head>
<body>
<div th:replace="~{layout/fragments :: appBackdrop}"></div>

<div class="app-shell">
    <aside th:replace="~{layout/fragments :: sideNav('leg-verify')}"></aside>
    <main class="app-main">
        <header th:replace="~{layout/fragments :: topBar('Verify Evidence Integrity', 'Legal UC-03 shell')}"></header>
        <section class="app-content">
            <article class="card">
                <h2>Verification request</h2>
                <form class="form-grid compact-form">
                    <label><span>Evidence ID</span><input type="text" placeholder="E-001"></label>
                    <label><span>Algorithm</span><select><option>SHA-256</option></select></label>
                    <button class="btn btn-primary" type="button">Run Verification</button>
                </form>
            </article>
        </section>
    </main>
</div>

<script th:src="@{/js/app.js}"></script>
</body>
</html>
