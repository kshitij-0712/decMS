<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verification Result</title>
    <style>
        body {
            margin: 0;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background: #f4f7fb;
            color: #1d2b45;
        }
        .container {
            max-width: 760px;
            margin: 42px auto;
            background: #ffffff;
            border-radius: 14px;
            box-shadow: 0 10px 24px rgba(15, 26, 44, 0.1);
            padding: 26px;
        }
        .badge {
            display: inline-block;
            padding: 7px 11px;
            border-radius: 999px;
            font-weight: 600;
            margin-bottom: 16px;
        }
        .ok {
            background: #dcfce7;
            color: #166534;
        }
        .fail {
            background: #fee2e2;
            color: #991b1b;
        }
        .field {
            margin-bottom: 10px;
        }
        .field span {
            font-weight: 600;
        }
        a {
            color: #1456b8;
            text-decoration: none;
        }
    </style>
</head>
<body>
<div class="container">
    <div th:classappend="${verification.integrityVerified} ? 'badge ok' : 'badge fail'" class="badge">
        <span th:text="${verification.integrityVerified} ? 'INTEGRITY VERIFIED' : 'TAMPERING DETECTED'">STATUS</span>
    </div>

    <h1>Verification Result</h1>
    <p th:text="${verification.statusMessage}">Result message</p>

    <div class="field"><span>Evidence ID:</span> <span th:text="${verification.evidenceId}">EVD-0000</span></div>
    <div class="field"><span>Stored Hash:</span> <code th:text="${verification.storedHash}">N/A</code></div>
    <div class="field"><span>Computed Hash:</span> <code th:text="${verification.computedHash}">N/A</code></div>

    <p><a th:href="@{/legal/verify}">Run another verification</a></p>
</div>
</body>
</html>
