<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/fragments :: appHead('Request Access')}"></head>
<body>
<div th:replace="~{layout/fragments :: appBackdrop}"></div>

<div class="app-shell">
    <aside th:replace="~{layout/fragments :: sideNav('leg-access')}"></aside>
    <main class="app-main">
        <header th:replace="~{layout/fragments :: topBar('Request Evidence Access', 'Legal UC-05 shell')}"></header>
        <section class="app-content">
            <article class="card">
                <h2>Access request form</h2>
                <form class="form-grid">
                    <label><span>Evidence ID</span><input type="text"></label>
                    <label><span>Case Number</span><input type="text"></label>
                    <label class="field-full"><span>Reason</span><textarea rows="4"></textarea></label>
                    <button class="btn btn-primary" type="button">Submit Request</button>
                </form>
            </article>
        </section>
    </main>
</div>

<script th:src="@{/js/app.js}"></script>
</body>
</html>
