<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Request Status</title>
    <style>
        body {
            margin: 0;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f9fc;
            color: #1f2e46;
        }
        .container {
            max-width: 900px;
            margin: 36px auto;
            background: #ffffff;
            border-radius: 14px;
            box-shadow: 0 10px 24px rgba(21, 37, 63, 0.12);
            padding: 24px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 14px;
        }
        th, td {
            border-bottom: 1px solid #dde5f2;
            padding: 10px;
            text-align: left;
            vertical-align: top;
        }
        th {
            background: #f0f5ff;
        }
        .status {
            font-weight: 600;
            color: #1d4ed8;
        }
        .empty {
            margin-top: 14px;
            color: #5a6b83;
        }
        a {
            color: #1250a8;
            text-decoration: none;
        }
        .success {
            background: #dcfce7;
            color: #166534;
            border-radius: 8px;
            padding: 10px 12px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Request Status</h1>

    <div th:if="${successMessage}" class="success" th:text="${successMessage}">Request submitted.</div>

    <table th:if="${!#lists.isEmpty(requests)}">
        <thead>
        <tr>
            <th>Request ID</th>
            <th>Evidence ID</th>
            <th>Case Number</th>
            <th>Reason</th>
            <th>Status</th>
            <th>Requested At</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="request : ${requests}">
            <td th:text="${request.requestId}">REQ-1</td>
            <td th:text="${request.evidenceId}">EVD-1</td>
            <td th:text="${request.caseNumber}">CASE-1</td>
            <td th:text="${request.reason}">Reason</td>
            <td class="status" th:text="${request.status}">PENDING</td>
            <td th:text="${request.requestedAt}">2026-01-01T00:00</td>
        </tr>
        </tbody>
    </table>

    <p th:if="${#lists.isEmpty(requests)}" class="empty">No requests submitted yet.</p>
    <p><a th:href="@{/legal/access}">Create a new access request</a></p>
</div>
</body>
</html>
