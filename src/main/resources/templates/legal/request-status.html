<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/fragments :: appHead('Request Status')}"></head>
<body>
<div th:replace="~{layout/fragments :: appBackdrop}"></div>

<div class="app-shell">
    <aside th:replace="~{layout/fragments :: sideNav('leg-access')}"></aside>
    <main class="app-main">
        <header th:replace="~{layout/fragments :: topBar('Access Request Status', 'Legal tracking shell')}"></header>
        <section class="app-content">
            <article class="card">
                <h2>Submitted requests</h2>
                <p th:text="${statusHint}">Integration hint.</p>
                <table class="table">
                    <thead><tr><th>Request ID</th><th>Evidence</th><th>Status</th></tr></thead>
                    <tbody><tr><td class="mono">REQ-001</td><td>E-001</td><td><span class="badge badge-pending">PENDING</span></td></tr></tbody>
                </table>
            </article>
        </section>
    </main>
</div>

<script th:src="@{/js/app.js}"></script>
</body>
</html>
