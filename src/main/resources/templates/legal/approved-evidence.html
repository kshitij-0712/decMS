<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/fragments :: appHead('Approved Evidence')}"></head>
<body>
<div th:replace="~{layout/fragments :: appBackdrop}"></div>

<div class="app-shell">
    <aside th:replace="~{layout/fragments :: sideNav('leg-evidence')}"></aside>
    <main class="app-main">
        <header th:replace="~{layout/fragments :: topBar('Approved Evidence', 'UC-05 view evidence details for approved requests')}"></header>
        <section class="app-content">
            <div th:replace="~{layout/fragments :: alerts}"></div>

            <article class="card">
                <h2>Evidence You Have Access To</h2>
                <div class="table-responsive" th:if="${!#lists.isEmpty(approvedEvidence)}">
                    <table class="table">
                        <thead>
                        <tr>
                            <th>Evidence ID</th>
                            <th>Type</th>
                            <th>Status</th>
                            <th>Case Number</th>
                            <th>Action</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="evidence : ${approvedEvidence}">
                            <td class="mono" th:text="${evidence.evidenceId}">E-001</td>
                            <td th:text="${evidence.evidenceType}">Type</td>
                            <td>
                                <span th:replace="~{layout/fragments :: statusBadge(${evidence.status})}"></span>
                            </td>
                            <td class="mono" th:text="${evidence.caseId}">CASE-001</td>
                            <td>
                                <a class="btn btn-sm btn-outline" th:href="@{/legal/evidence/{id}(id=${evidence.evidenceId})}">View Details</a>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>

                <div class="empty-state" th:if="${#lists.isEmpty(approvedEvidence)}">
                    <h3>No approved evidence</h3>
                    <p>You have not been granted access to any evidence yet, or your access requests are still pending.</p>
                    <a class="btn btn-primary" th:href="@{/legal/access}">Request Access</a>
                </div>
            </article>
        </section>
    </main>
</div>

<script th:src="@{/js/app.js}"></script>
</body>
</html>
