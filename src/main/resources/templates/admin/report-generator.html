<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/fragments :: appHead('Report Generator')}"></head>
<body>
<div th:replace="~{layout/fragments :: appBackdrop}"></div>

<div class="app-shell">
    <aside th:replace="~{layout/fragments :: sideNav('adm-reports')}"></aside>
    <main class="app-main">
        <header th:replace="~{layout/fragments :: topBar('Generate Audit Report', 'Admin UC-04 shell')}"></header>
        <section class="app-content">
            <article class="card">
                <h2>Report filters</h2>
                <form class="form-grid compact-form">
                    <label><span>Case ID</span><input type="text"></label>
                    <label><span>Format</span><select><option>HTML</option><option>PDF</option></select></label>
                    <button class="btn btn-primary" type="button">Generate</button>
                </form>
            </article>
        </section>
    </main>
</div>

<script th:src="@{/js/app.js}"></script>
</body>
</html>
