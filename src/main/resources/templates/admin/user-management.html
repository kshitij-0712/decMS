<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/fragments :: appHead('User Management')}"></head>
<body>
<div th:replace="~{layout/fragments :: appBackdrop}"></div>

<div class="app-shell">
    <aside th:replace="~{layout/fragments :: sideNav('adm-users')}"></aside>
    <main class="app-main">
        <header th:replace="~{layout/fragments :: topBar('User Management', 'Admin UC-07 shell')}"></header>
        <section class="app-content">
            <article class="card">
                <h2>Users and roles</h2>
                <div class="button-row"><a class="btn btn-primary" th:href="@{/admin/users/new}">Create User</a></div>
                <table class="table">
                    <thead><tr><th>User</th><th>Role</th><th>Status</th></tr></thead>
                    <tbody><tr><td>inv-001</td><td>INVESTIGATOR</td><td><span class="badge badge-approved">ACTIVE</span></td></tr></tbody>
                </table>
            </article>
        </section>
    </main>
</div>

<script th:src="@{/js/app.js}"></script>
</body>
</html>
