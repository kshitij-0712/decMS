<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/fragments :: appHead(${pageTitle})}"></head>
<body>
<div th:replace="~{layout/fragments :: appBackdrop}"></div>

<div class="app-shell">
    <aside th:replace="~{layout/fragments :: sideNav(${activePage})}"></aside>

    <main class="app-main">
        <header th:replace="~{layout/fragments :: topBar(${pageTitle}, ${pageSubtitle})}"></header>

        <section class="app-content">
            <div th:replace="~{layout/fragments :: alerts}"></div>
            <th:block th:replace="${contentTemplate}"></th:block>
        </section>
    </main>
</div>

<script th:src="@{/js/app.js}"></script>
</body>
</html>
