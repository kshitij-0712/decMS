<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/fragments :: appHead('Unexpected Error')}"></head>
<body>
<div th:replace="~{layout/fragments :: appBackdrop}"></div>

<main class="auth-shell">
    <section class="auth-card">
        <header>
            <p class="eyebrow">System</p>
            <h1>Something went wrong</h1>
            <p>An unexpected error occurred while processing your request.</p>
        </header>
        <div class="button-row">
            <a th:href="@{/}" class="btn btn-primary">Go to Home</a>
            <a th:href="@{/login}" class="btn btn-secondary">Back to Login</a>
        </div>
    </section>
</main>

<script th:src="@{/js/app.js}"></script>
</body>
</html>
