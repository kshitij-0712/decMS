<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/fragments :: appHead('Evidence Browser')}"></head>
<body>
<div th:replace="~{layout/fragments :: appBackdrop}"></div>

<div class="app-shell">
    <aside th:replace="~{layout/fragments :: sideNav('inv-list')}"></aside>
    <main class="app-main">
        <header th:replace="~{layout/fragments :: topBar('Evidence Browser', 'UC-06 list, search, and open details')}"></header>

        <section class="app-content">
            <div th:replace="~{layout/fragments :: alerts}"></div>

            <article class="card">
                <h2>Filter evidence</h2>
                <form method="get" th:action="@{/investigator/evidence}" class="form-grid compact-form">
                    <label>
                        <span>Case ID</span>
                        <input type="text" name="caseId" th:value="${selectedCaseId}" placeholder="CASE-2026">
                    </label>
                    <label>
                        <span>Status</span>
                        <select name="status">
                            <option value="">All statuses</option>
                            <option th:each="status : ${statusOptions}" th:value="${status}" th:text="${status}"
                                    th:selected="${status == selectedStatus}"></option>
                        </select>
                    </label>
                    <div class="button-row">
                        <button type="submit" class="btn btn-primary">Apply Filters</button>
                        <a th:href="@{/investigator/evidence}" class="btn btn-ghost">Reset</a>
                    </div>
                </form>
            </article>

            <article class="card">
                <h2>Evidence records</h2>
                <div class="table-wrap">
                    <table class="table" th:if="${!#lists.isEmpty(evidenceItems)}">
                        <thead>
                        <tr>
                            <th>Evidence ID</th>
                            <th>Case ID</th>
                            <th>Type</th>
                            <th>File Size</th>
                            <th>Status</th>
                            <th>Uploaded At</th>
                            <th>Action</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="item : ${evidenceItems}">
                            <td class="mono" th:text="${item.evidenceId}">id</td>
                            <td th:text="${item.caseId}">case</td>
                            <td th:text="${item.evidenceType}">type</td>
                            <td th:text="${T(java.lang.String).format('%,d bytes', item.fileSize)}">bytes</td>
                            <td><span class="badge" th:classappend="|badge-${#strings.toLowerCase(item.status)}|" th:text="${item.status}">SEALED</span></td>
                            <td th:text="${#temporals.format(item.uploadedAt, 'yyyy-MM-dd HH:mm')}">timestamp</td>
                            <td><a class="link" th:href="@{/investigator/evidence/{id}(id=${item.evidenceId})}">Open</a></td>
                        </tr>
                        </tbody>
                    </table>

                    <div class="empty-state" th:if="${#lists.isEmpty(evidenceItems)}">
                        <h3>No evidence found</h3>
                        <p>Try changing filters or upload new evidence.</p>
                        <a class="btn btn-primary" th:href="@{/investigator/upload}">Upload Evidence</a>
                    </div>
                </div>
            </article>
        </section>
    </main>
</div>

<script th:src="@{/js/app.js}"></script>
</body>
</html>
