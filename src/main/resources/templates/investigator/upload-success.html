<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/fragments :: appHead('Upload Success')}"></head>
<body>
<div th:replace="~{layout/fragments :: appBackdrop}"></div>

<div class="app-shell">
    <aside th:replace="~{layout/fragments :: sideNav('inv-upload')}"></aside>
    <main class="app-main">
        <header th:replace="~{layout/fragments :: topBar('Evidence Sealed', 'UC-01 completed successfully')}"></header>

        <section class="app-content">
            <article class="card card-highlight" th:if="${uploadResult}">
                <h2>Seal complete</h2>
                <p>Evidence has been stored, hashed, and logged in custody timeline.</p>

                <dl class="meta-grid">
                    <dt>Evidence ID</dt>
                    <dd class="mono" th:text="${uploadResult.evidenceId}">EV-ID</dd>

                    <dt>Hash (SHA-256)</dt>
                    <dd class="mono" th:text="${uploadResult.hashValue}">hash</dd>

                    <dt>Status</dt>
                    <dd><span class="badge badge-sealed" th:text="${uploadResult.status}">SEALED</span></dd>

                    <dt>Duplicate hash check</dt>
                    <dd th:text="${uploadResult.duplicateHash} ? 'Warning: matching hash exists' : 'No duplicate hash detected'">
                        No duplicate hash detected
                    </dd>
                </dl>

                <div class="button-row">
                    <a th:href="@{/investigator/evidence/{id}(id=${uploadResult.evidenceId})}" class="btn btn-primary">Open Details</a>
                    <a th:href="@{/investigator/upload}" class="btn btn-secondary">Upload Another</a>
                    <a th:href="@{/investigator/evidence}" class="btn btn-ghost">View All Evidence</a>
                </div>
            </article>
        </section>
    </main>
</div>

<script th:src="@{/js/app.js}"></script>
</body>
</html>
